# Builds Readflix for Windows and Android, and publishes the website, every time you push to GitHub.
# Results: open the "Actions" tab on GitHub, click the latest run, and download from "Artifacts".
name: Build Readflix

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Windows app (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Readflix-Windows
          path: release/Readflix-*.exe
          if-no-files-found: error

  android:
    name: Android app (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: npx capacitor-assets generate --android
        continue-on-error: true
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk Readflix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Readflix-Android
          path: Readflix.apk
          if-no-files-found: error

  website:
    name: Website (GitHub Pages)
    runs-on: ubuntu-latest
    # Turn on once: repository Settings > Pages > Source: "GitHub Actions"
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
